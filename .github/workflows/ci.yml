name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Formato
        run: ruff format --check src tests scripts
      - name: Tests
        run: python -m pytest -q

  imagen:
    name: Build de la imagen y prueba de humo
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen (solo el modelo tiny para ir rapido)
        run: docker build --build-arg ASR_MODELOS=tiny -t actaflow-ai-engine:ci .
      - name: Arrancar el contenedor con limites parecidos a Render Free
        run: |
          docker run -d --name motor -p 8002:8002 --memory=512m \
            -e ACTAFLOW_ENGINE_HMAC_SECRET=secreto-de-ci-publico-no-usar-en-produccion-000 \
            actaflow-ai-engine:ci
      - name: Esperar /health y comprobar el modelo
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8002/health > health.json; then break; fi
            sleep 2
          done
          cat health.json
          grep -q '"listo":true' health.json
          grep -q 'es_core_news_sm' health.json
      - name: Benchmark real de tiny dentro del contenedor
        run: |
          docker exec -i motor python - <<'EOF'
          import json, os, time, urllib.request
          from actaflow_engine.seguridad.hmac_firma import cabeceras_firmadas
          cuerpo = json.dumps({"modelos": ["tiny"], "con_spacy": True}).encode()
          cab = {"Content-Type": "application/json"}
          cab.update(cabeceras_firmadas(os.environ["ACTAFLOW_ENGINE_HMAC_SECRET"], "POST",
                                        "/v1/diagnostico/benchmark", cuerpo))
          req = urllib.request.Request("http://localhost:8002/v1/diagnostico/benchmark",
                                       data=cuerpo, headers=cab, method="POST")
          datos = json.loads(urllib.request.urlopen(req, timeout=600).read())
          print(json.dumps(datos, indent=2, ensure_ascii=False))
          assert datos["resultados"][0]["estado"] == "ok", datos
          EOF
      - name: Logs del contenedor
        if: always()
        run: docker logs motor
